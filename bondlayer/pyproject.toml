[project]
name = "bondlayer"
version = "0.1.0"
description = "Verifiable, valued merchant benefit records for AI shopping agents"
requires-python = ">=3.12"
# Unpinned lower bounds on purpose: exact pins have no wheels for newer
# Pythons (3.14) and fail to install on a judge's laptop.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "cryptography>=42.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",   # FastAPI UploadFile in ucp/onboard.py
    "pypdf>=4.0",                # policy.py reads merchant policy PDFs
    # WS-A: similarity dependency goes here
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
