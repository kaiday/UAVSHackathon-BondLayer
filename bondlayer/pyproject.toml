[project]
name = "bondlayer"
version = "0.1.0"
description = "Verifiable, valued merchant benefit records for AI shopping agents"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
