[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bondlayer"
version = "0.1.0"
description = "BondLayer - FPT hackathon demo"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["valuation", "interpreter", "ucp", "adapters"]
