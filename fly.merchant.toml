# Fly.io app: BondLayer merchant server (UCP routes, /console, /onboard).
# Deploy from the repo root:   fly deploy --config fly.merchant.toml --ha=false
# See docs/deploy-fly.md. App names are global on Fly: if this one is taken,
# change it here AND in BONDLAYER_MERCHANT_URL in fly.agent.toml.
app = "bondlayer-merchant"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.merchant"

[env]
  # Demo data on: every bundled merchant (synthetic with signed records, plus
  # Big W, JB Hi-Fi, Kmart, Officeworks). Merchants onboarded on the volume
  # still load on top. Remove it for an empty start.
  BONDLAYER_UPLOADS_DIR = "/data/uploads"
  BONDLAYER_AI_MODE = "openai"
  BONDLAYER_DEMO_DATA = "1"
  BONDLAYER_REQUIRE_SERVICE_TOKEN = "1"
  # Set OPENAI_API_KEY and BONDLAYER_SERVICE_TOKEN with fly secrets.

# Persistent disk for onboarded merchants, so a restart or redeploy keeps them.
# Create it once before the first deploy:
#   fly volumes create bondlayer_data --region syd --size 1 --config fly.merchant.toml -y
[[mounts]]
  source = "bondlayer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: never stopped for being idle. The buyer agent calls this server
  # over HTTP, and judges may open it at any time. To pause it
  # (no running cost): fly scale count 0 --config fly.merchant.toml
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # /health answers even with no merchants onboarded yet.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
