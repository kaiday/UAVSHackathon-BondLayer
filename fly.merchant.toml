# Fly.io app: BondLayer merchant server (UCP routes, /console, /dashboard, /onboard).
# Deploy from the repo root:   fly deploy --config fly.merchant.toml
# See docs/deploy-fly.md. App names are global on Fly: if this one is taken,
# change it here AND in BONDLAYER_MERCHANT_URL in fly.agent.toml.
app = "bondlayer-merchant"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile.merchant"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: never stopped for being idle. The buyer agent calls this server
  # with a 10 s timeout, and judges may open it at any time. To pause it
  # (no running cost): fly scale count 0 --config fly.merchant.toml
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/voltway/.well-known/ucp"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
